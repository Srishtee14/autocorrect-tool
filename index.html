<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Autocorrect Tool</title><style>
body {
    font-family: Arial, sans-serif;
    background: #e8f5e9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
    box-sizing: border-box;
}
.container {
    background: white;
    width: 100%;
    max-width: 650px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #bbb;
    box-sizing: border-box;
}
h1 { color: #218838; text-align: center; }
textarea {
    width: 100%;
    height: 130px;
    padding: 12px;
    box-sizing: border-box;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 8px;
}
button {
    padding: 10px 14px;
    margin: 8px 5px 0 0;
    background: #218838;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
button:hover { background: #176b2c; }
.result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f8e9;
    border-radius: 8px;
    overflow-wrap: anywhere;
}
.suggestion {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}
.small { font-size: 13px; color: #555; }
</style></head><body>
<div class="container">
    <h1>Smart Autocorrect Tool</h1>
    <p>Enter text to check spelling and get correction suggestions.</p><textarea id="inputText" placeholder="Example: I am lerning pythn."></textarea>

<button onclick="checkText()">Check Spelling</button>
<button onclick="resetTool()">Clear</button>

<div class="result">
    <h3>Corrected Text</h3>
    <p id="outputText">Your result will appear here.</p>
</div>

<div class="result">
    <h3>Spelling Suggestions</h3>
    <div id="suggestions">Suggestions will appear here.</div>
</div>

<p class="small">
    This tool checks words against a built-in dictionary.
    Unknown words may not always be identified correctly.
</p>

</div><script>
const dictionary = {
    teh: "the",
    lerning: "learning",
    learnig: "learning",
    progrmming: "programming",
    recieve: "receive",
    recieved: "received",
    beautifull: "beautiful",
    beautful: "beautiful",
    mesage: "message",
    enviroment: "environment",
    becuase: "because",
    definately: "definitely",
    adress: "address",
    freind: "friend",
    wierd: "weird",
    thier: "their",
    seperate: "separate",
    untill: "until",
    knowlege: "knowledge",
    sucess: "success",
    speling: "spelling",
    pythn: "python",
    javscript: "javascript",
    langauge: "language",
    writting: "writing",
    tommorow: "tomorrow",
    goverment: "government",
    acheive: "achieve",
    begining: "beginning",
    calender: "calendar",
    comming: "coming",
    diffrent: "different",
    importent: "important",
    intresting: "interesting",
    neccessary: "necessary",
    occassion: "occasion",
    oportunity: "opportunity",
    priviledge: "privilege",
    recieveing: "receiving",
    responsibile: "responsible",
    studing: "studying",
    thankyou: "thank you"
};

let originalWords = [];
let currentSuggestions = {};

function capitalizeLikeOriginal(original, replacement) {
    if (original === original.toUpperCase()) {
        return replacement.toUpperCase();
    }
    if (original[0] === original[0].toUpperCase()) {
        return replacement[0].toUpperCase() + replacement.slice(1);
    }
    return replacement;
}

function checkText() {
    const input = document.getElementById("inputText").value;
    const output = document.getElementById("outputText");
    const suggestions = document.getElementById("suggestions");

    if (!input.trim()) {
        output.textContent = "Please enter some text.";
        suggestions.textContent = "Nothing to check.";
        return;
    }

    originalWords = [];
    currentSuggestions = {};

    const corrected = input.replace(/\b[\w']+\b/g, function(word) {
        const key = word.toLowerCase();

        if (dictionary[key]) {
            const replacement = capitalizeLikeOriginal(word, dictionary[key]);
            originalWords.push({word: word, replacement: replacement});
            currentSuggestions[word] = replacement;
            return replacement;
        }

        return word;
    });

    output.textContent = corrected;
    suggestions.innerHTML = "";

    if (originalWords.length === 0) {
        suggestions.textContent =
            "No matching spelling errors found in the built-in dictionary. Unknown words cannot always be detected.";
        return;
    }

    originalWords.forEach(function(item, index) {
        const row = document.createElement("div");
        row.className = "suggestion";

        const label = document.createElement("span");
        label.textContent = item.word + " → " + item.replacement + " ";

        const button = document.createElement("button");
        button.textContent = "Accept";
        button.onclick = function() {
            acceptSuggestion(item.word, item.replacement);
        };

        row.appendChild(label);
        row.appendChild(button);
        suggestions.appendChild(row);
    });

    const note = document.createElement("p");
    note.className = "small";
    note.textContent = "Accept a suggestion to apply it to the input text.";
    suggestions.appendChild(note);
}

function acceptSuggestion(wrong, right) {
    const input = document.getElementById("inputText");
    const pattern = new RegExp("\\b" + wrong.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");

    input.value = input.value.replace(pattern, function(word) {
        if (word === word.toUpperCase()) return right.toUpperCase();
        if (word[0] === word[0].toUpperCase()) {
            return right[0].toUpperCase() + right.slice(1);
        }
        return right;
    });

    checkText();
}

function resetTool() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputText").textContent = "Your result will appear here.";
    document.getElementById("suggestions").textContent = "Suggestions will appear here.";
    originalWords = [];
    currentSuggestions = {};
}
</script></body>
</html>
